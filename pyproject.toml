[project]
name = "stock-score"
version = "0.1.0"
description = "A股多维度评分系统"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pywencai>=0.13.1",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["backend*"]
